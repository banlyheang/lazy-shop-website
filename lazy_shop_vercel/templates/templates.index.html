{% extends "base.html" %}
{% block content %}
<div class="hero-section bg-primary text-white text-center py-5 mb-4">
    <h1>Welcome to L@ZY SHOP</h1>
    <p>Quality products with fast delivery</p>
    <a href="{{ url_for('shop') }}" class="btn btn-light btn-lg">Shop Now →</a>
</div>
<h2 class="text-center mb-4">Featured Products</h2>
<div class="row">
    {% for product in featured_products %}
    <div class="col-md-3 mb-4">
        <div class="card">
            <div class="card-body">
                <h5 class="card-title">{{ product.name }}</h5>
                <p class="card-text">${{ "%.2f"|format(product.price) }}</p>
                <a href="{{ url_for('product_detail', product_id=product.id) }}" class="btn btn-primary">View</a>
            </div>
        </div>
    </div>
    {% endfor %}
</div>
{% endblock %}
