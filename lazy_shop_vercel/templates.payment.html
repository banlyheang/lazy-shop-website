{% extends "base.html" %}
{% block content %}
<h1>Payment for Order #{{ order.order_number }}</h1>
<p>Amount: ${{ "%.2f"|format(order.total_amount) }}</p>
<img src="data:image/png;base64,{{ qr_base64 }}" alt="QR Code" class="img-fluid mb-3">
<h4>Bank Transfer Details:</h4>
<p>Bank: {{ bank_name }}</p>
<p>Account: {{ account_number }}</p>
<p>Name: {{ account_name }}</p>
<form method="POST" action="{{ url_for('upload_receipt', order_id=order.id) }}" enctype="multipart/form-data">
    <input type="file" name="receipt_image" class="form-control mb-2" required>
    <button type="submit" class="btn btn-primary">Upload Receipt</button>
</form>
{% endblock %}
